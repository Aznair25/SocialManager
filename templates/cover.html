<div class="slide {{paletteClass}}">
  <div class="arcs" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="head">
    <div class="wordmark" role="img" aria-label="{{wordmark}}"></div>
  </div>
  <div class="body cover">
    <h1 class="hook">{{hook}}</h1>
    <!-- Curved arrow pointing in at the hook — the cover carries the fewest words
         in the deck, so a drawn element does work the copy would otherwise have to. -->
    <div class="cover-arrow" aria-hidden="true">
      <svg width="185" height="226" viewBox="0 0 180 220" fill="none"
           stroke="currentColor" stroke-width="5"
           stroke-linecap="round" stroke-linejoin="round">
        <!-- Looping hand-drawn arrow: the stroke crosses itself once before the
             sweep down, which is what makes it read as drawn rather than as a plain arc. -->
        <path d="M60 10 C130 40, 130 100, 70 100 C30 100, 30 50, 75 55 C125 62, 152 130, 95 200" />
        <!-- Wings splayed +/-28deg about the exit tangent; collinear wings read as a kink. -->
        <path d="M126 187 L95 200 L102 167" />
      </svg>
    </div>
  </div>
  <div class="foot">
    <span>{{handle}}</span>
    <span class="swipe-corner">swipe to read
      <svg width="52" height="10" viewBox="0 0 52 10" fill="none">
        <path d="M0 5 H49 M44 1 L50 5 L44 9" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </div>
</div>
