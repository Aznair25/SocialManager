<div class="slide {{paletteClass}}">
  <div class="head">
    <div class="wordmark" role="img" aria-label="{{wordmark}}"></div>
    <div class="tag-chip">{{kicker}}</div>
  </div>
  <div class="body cover">
    <h1 class="hook">{{hook}}</h1>
    <!-- Visual swipe affordance: the cover carries the fewest words in the deck,
         so the arrow does the work the copy would otherwise have to. Absolutely
         positioned, so it never shifts the hook off its vertical centre. -->
    <div class="cover-cue" aria-hidden="true">
      <div class="cover-arrow">
        <svg width="132" height="132" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="47" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
          <path d="M32 50 H67 M55 37 L68 50 L55 63" stroke="currentColor" stroke-width="4.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="cover-swipe">swipe</div>
    </div>
  </div>
  <div class="foot">
    <span>{{handle}}</span>
    <span class="index">{{index}}</span>
  </div>
</div>
