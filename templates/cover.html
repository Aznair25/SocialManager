<div class="slide {{paletteClass}}">
  <div class="head">
    <div class="wordmark" role="img" aria-label="{{wordmark}}"></div>
    <div class="tag-chip">{{kicker}}</div>
  </div>
  <div class="body cover">
    <h1 class="hook">{{hook}}</h1>
  </div>
  <div class="foot">
    <span>{{handle}}</span>
    <span class="swipe-pill">swipe <span>→</span></span>
  </div>
</div>
