<div class="slide {{paletteClass}}">
  <div class="arcs" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="head">
    <div class="wordmark" role="img" aria-label="{{wordmark}}"></div>
  </div>
  <div class="body cta">
    <h2 class="cta-line">{{line}}</h2>
    <div class="cta-pill">{{button}} <span class="arr-chip">→</span></div>
  </div>
  <div class="foot">
    <span>{{handle}}</span>
    <span class="index">{{index}}</span>
  </div>
</div>
