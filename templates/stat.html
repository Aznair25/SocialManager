<div class="slide {{paletteClass}}">
  <div class="head">
    <div class="wordmark" role="img" aria-label="{{wordmark}}"></div>
    <div class="tag-chip">{{kicker}}</div>
  </div>
  <div class="body stat">
    <div class="value" data-len="{{valueLen}}">{{value}}</div>
    <div class="label">{{label}}</div>
    <div class="context">{{context}}</div>
  </div>
  <div class="foot">
    <span>{{handle}}</span>
    <span class="index">{{index}}</span>
  </div>
</div>
