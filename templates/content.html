<div class="slide {{paletteClass}}">
  <div class="head">
    <div class="wordmark" role="img" aria-label="{{wordmark}}"></div>
    <div class="tag-chip"></div>
  </div>
  <div class="body content">
    <div class="kicker">{{kicker}}</div>
    <h2 class="title">{{title}}</h2>
    <p class="para">{{body}}</p>
  </div>
  <div class="foot">
    <span>{{handle}}</span>
    <span class="index">{{index}}</span>
  </div>
</div>
